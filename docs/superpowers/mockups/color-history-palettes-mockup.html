<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Color Tool — History + Palettes (mockup)</title>
    <style>
      :root {
        --bg: #1c1d21;
        --panel: #232428;
        --muted: #2b2d33;
        --border: #34363d;
        --fg: #e6e7ea;
        --fg-dim: #9a9ca3;
        --primary: #6e8bff;
        --success: #46c08a;
        --error: #e26d6d;
        --radius: 8px;
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #141518;
        color: var(--fg);
        font-family: var(--font);
        display: flex;
        justify-content: center;
        padding: 32px;
      }
      .window {
        width: 980px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .titlebar {
        height: 38px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .dot { width: 12px; height: 12px; border-radius: 50%; }
      .dot.r { background: #ff5f57; }
      .dot.y { background: #febc2e; }
      .dot.g { background: #28c840; }
      .titlebar .name { margin-left: 10px; font-size: 13px; color: var(--fg-dim); }

      .body {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 16px;
        max-height: 760px;
        overflow-y: auto; /* spec: root container gains overflow-y-auto */
      }

      /* ---- Input row ---- */
      .input-row { display: flex; align-items: center; gap: 8px; }
      .input-row input {
        flex: 1;
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--fg);
        font-family: var(--mono);
        font-size: 13px;
        padding: 7px 12px;
        outline: none;
      }
      .input-row input:focus { border-color: rgba(110, 139, 255, 0.5); box-shadow: 0 0 0 2px rgba(110, 139, 255, 0.2); }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        font-size: 13px;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      .btn:hover { background: var(--muted); }
      .btn:disabled { opacity: 0.4; cursor: default; }
      .btn:disabled:hover { background: transparent; }
      .btn svg { width: 15px; height: 15px; }
      .preview {
        width: 32px;
        height: 32px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        flex-shrink: 0;
      }

      /* ---- History strip (NEW) ---- */
      .history { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .history .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg-dim); margin-right: 2px; }
      .swatch {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: 1px solid var(--border);
        cursor: pointer;
        padding: 0;
        transition: transform 0.08s ease;
      }
      .swatch:hover { transform: scale(1.12); border-color: var(--fg-dim); }

      /* ---- Model rows ---- */
      .models { display: flex; flex-direction: column; }
      .model-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        border-bottom: 1px solid var(--border);
        padding: 8px 0;
      }
      .model-row .key { width: 64px; flex-shrink: 0; font-size: 11px; text-transform: uppercase; color: var(--fg-dim); }
      .model-row .val { font-family: var(--mono); font-size: 13px; }

      /* ---- Contrast checker ---- */
      .contrast {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px;
      }
      .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg-dim); margin-bottom: 10px; }
      .contrast .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .contrast input {
        width: 110px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--fg);
        font-family: var(--mono);
        font-size: 13px;
        padding: 5px 8px;
        outline: none;
      }
      .aa-chip { border-radius: 4px; padding: 4px 12px; font-size: 14px; }
      .ratio { font-family: var(--mono); font-size: 13px; }
      .badge { border-radius: 4px; padding: 2px 6px; font-size: 11px; }
      .badge.pass { background: rgba(70, 192, 138, 0.2); color: var(--success); }

      /* ---- Color sets section (NEW) ---- */
      .palettes { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
      .palettes-header { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
      .palettes-header .chevron { transition: transform 0.15s ease; color: var(--fg-dim); display: inline-flex; }
      .palettes.collapsed .chevron { transform: rotate(-90deg); }
      .palettes-header .section-title { margin-bottom: 0; }
      .palettes-tabs { display: inline-flex; gap: 4px; margin-left: auto; }
      .ptab {
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 6px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--fg-dim);
        cursor: pointer;
      }
      .ptab:hover { background: var(--muted); }
      .ptab.active { background: var(--muted); border-color: var(--border); color: var(--fg); }
      .palettes-body { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
      .palettes.collapsed .palettes-body { display: none; }
      .hue-row { display: flex; align-items: center; gap: 8px; }
      .hue-row .hue-name {
        width: 92px;
        flex-shrink: 0;
        font-size: 11px;
        color: var(--fg-dim);
        font-family: var(--mono);
      }
      .hue-row .cells { display: flex; gap: 4px; flex: 1; }
      .cell {
        flex: 1;
        height: 24px;
        border-radius: 4px;
        border: 1px solid rgba(0, 0, 0, 0.25);
        cursor: pointer;
        padding: 0;
      }
      .cell:hover { transform: scale(1.15); border-color: var(--fg); position: relative; z-index: 1; }

      .note { font-size: 12px; color: var(--fg-dim); padding: 4px 2px 0; }
      .note code { font-family: var(--mono); color: var(--fg); }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="titlebar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="name">ToolKit — 颜色</span>
      </div>
      <div class="body">
        <!-- Input row: input + NEW save button + pick + preview -->
        <div class="input-row">
          <input id="color-input" value="#6e8bff" spellcheck="false" />
          <button class="btn" id="save-btn" title="保存到历史">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            保存
          </button>
          <button class="btn" title="屏幕取色">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg>
            取色
          </button>
          <div class="preview" id="preview"></div>
        </div>

        <!-- NEW: history swatch strip (hidden when empty) -->
        <div class="history" id="history">
          <span class="label">历史</span>
        </div>

        <!-- Existing model rows -->
        <div class="models" id="models"></div>

        <!-- Existing contrast checker -->
        <div class="contrast">
          <div class="section-title">对比度检查</div>
          <div class="row">
            <input value="#000000" spellcheck="false" />
            <input value="#ffffff" spellcheck="false" />
            <span class="aa-chip" style="color: #000; background: #fff">Aa</span>
            <span class="ratio">21.00:1</span>
            <span class="badge pass">AA 大字 通过</span>
            <span class="badge pass">AA 通过</span>
            <span class="badge pass">AAA 通过</span>
          </div>
        </div>

        <!-- NEW: color sets section -->
        <div class="palettes" id="palettes">
          <div class="palettes-header" id="palettes-header">
            <span class="chevron">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
            <span class="section-title">颜色集合</span>
            <div class="palettes-tabs">
              <button class="ptab active" data-palette="tailwind">Tailwind</button>
              <button class="ptab" data-palette="material">Material</button>
            </div>
          </div>
          <div class="palettes-body" id="palettes-body"></div>
        </div>

        <p class="note">
          mockup 说明：点击「保存」把当前颜色加入历史条；点击历史色块 / 色板色块会回填输入框
          （hover 显示名称 + hex，如 <code>blue-500 #3b82f6</code>）。布局即 spec 中的方案 A：页内折叠区块。
        </p>
      </div>
    </div>

    <script>
      // ---- palette data (Tailwind v3.4 hexes; Material 2014) — illustrative for the mockup ----
      const TW_SHADES = ["50","100","200","300","400","500","600","700","800","900","950"];
      const tailwind = {
        slate:   ["#f8fafc","#f1f5f9","#e2e8f0","#cbd5e1","#94a3b8","#64748b","#475569","#334155","#1e293b","#0f172a","#020617"],
        gray:    ["#f9fafb","#f3f4f6","#e5e7eb","#d1d5db","#9ca3af","#6b7280","#4b5563","#374151","#1f2937","#111827","#030712"],
        zinc:    ["#fafafa","#f4f4f5","#e4e4e7","#d4d4d8","#a1a1aa","#71717a","#52525b","#3f3f46","#27272a","#18181b","#09090b"],
        neutral: ["#fafafa","#f5f5f5","#e5e5e5","#d4d4d4","#a3a3a3","#737373","#525252","#404040","#262626","#171717","#0a0a0a"],
        stone:   ["#fafaf9","#f5f5f4","#e7e5e4","#d6d3d1","#a8a29e","#78716c","#57534e","#44403c","#292524","#1c1917","#0c0a09"],
        red:     ["#fef2f2","#fee2e2","#fecaca","#fca5a5","#f87171","#ef4444","#dc2626","#b91c1c","#991b1b","#7f1d1d","#450a0a"],
        orange:  ["#fff7ed","#ffedd5","#fed7aa","#fdba74","#fb923c","#f97316","#ea580c","#c2410c","#9a3412","#7c2d12","#431407"],
        amber:   ["#fffbeb","#fef3c7","#fde68a","#fcd34d","#fbbf24","#f59e0b","#d97706","#b45309","#92400e","#78350f","#451a03"],
        yellow:  ["#fefce8","#fef9c3","#fef08a","#fde047","#facc15","#eab308","#ca8a04","#a16207","#854d0e","#713f12","#422006"],
        lime:    ["#f7fee7","#ecfccb","#d9f99d","#bef264","#a3e635","#84cc16","#65a30d","#4d7c0f","#3f6212","#365314","#1a2e05"],
        green:   ["#f0fdf4","#dcfce7","#bbf7d0","#86efac","#4ade80","#22c55e","#16a34a","#15803d","#166534","#14532d","#052e16"],
        emerald: ["#ecfdf5","#d1fae5","#a7f3d0","#6ee7b7","#34d399","#10b981","#059669","#047857","#065f46","#064e3b","#022c22"],
        teal:    ["#f0fdfa","#ccfbf1","#99f6e4","#5eead4","#2dd4bf","#14b8a6","#0d9488","#0f766e","#115e59","#134e4a","#042f2e"],
        cyan:    ["#ecfeff","#cffafe","#a5f3fc","#67e8f9","#22d3ee","#06b6d4","#0891b2","#0e7490","#155e75","#164e63","#083344"],
        sky:     ["#f0f9ff","#e0f2fe","#bae6fd","#7dd3fc","#38bdf8","#0ea5e9","#0284c7","#0369a1","#075985","#0c4a6e","#082f49"],
        blue:    ["#eff6ff","#dbeafe","#bfdbfe","#93c5fd","#60a5fa","#3b82f6","#2563eb","#1d4ed8","#1e40af","#1e3a8a","#172554"],
        indigo:  ["#eef2ff","#e0e7ff","#c7d2fe","#a5b4fc","#818cf8","#6366f1","#4f46e5","#4338ca","#3730a3","#312e81","#1e1b4b"],
        violet:  ["#f5f3ff","#ede9fe","#ddd6fe","#c4b5fd","#a78bfa","#8b5cf6","#7c3aed","#6d28d9","#5b21b6","#4c1d95","#2e1065"],
        purple:  ["#faf5ff","#f3e8ff","#e9d5ff","#d8b4fe","#c084fc","#a855f7","#9333ea","#7e22ce","#6b21a8","#581c87","#3b0764"],
        fuchsia: ["#fdf4ff","#fae8ff","#f5d0fe","#f0abfc","#e879f9","#d946ef","#c026d3","#a21caf","#86198f","#701a75","#4a044e"],
        pink:    ["#fdf2f8","#fce7f3","#fbcfe8","#f9a8d4","#f472b6","#ec4899","#db2777","#be185d","#9d174d","#831843","#500724"],
        rose:    ["#fff1f2","#ffe4e6","#fecdd3","#fda4af","#fb7185","#f43f5e","#e11d48","#be123c","#9f1239","#881337","#4c0519"],
      };
      const MAT_SHADES = ["50","100","200","300","400","500","600","700","800","900"];
      const material = {
        "Red":         ["#ffebee","#ffcdd2","#ef9a9a","#e57373","#ef5350","#f44336","#e53935","#d32f2f","#c62828","#b71c1c"],
        "Pink":        ["#fce4ec","#f8bbd0","#f48fb1","#f06292","#ec407a","#e91e63","#d81b60","#c2185b","#ad1457","#880e4f"],
        "Purple":      ["#f3e5f5","#e1bee7","#ce93d8","#ba68c8","#ab47bc","#9c27b0","#8e24aa","#7b1fa2","#6a1b9a","#4a148c"],
        "Deep Purple": ["#ede7f6","#d1c4e9","#b39ddb","#9575cd","#7e57c2","#673ab7","#5e35b1","#512da8","#4527a0","#311b92"],
        "Indigo":      ["#e8eaf6","#c5cae9","#9fa8da","#7986cb","#5c6bc0","#3f51b5","#3949ab","#303f9f","#283593","#1a237e"],
        "Blue":        ["#e3f2fd","#bbdefb","#90caf9","#64b5f6","#42a5f5","#2196f3","#1e88e5","#1976d2","#1565c0","#0d47a1"],
        "Light Blue":  ["#e1f5fe","#b3e5fc","#81d4fa","#4fc3f7","#29b6f6","#03a9f4","#039be5","#0288d1","#0277bd","#01579b"],
        "Cyan":        ["#e0f7fa","#b2ebf2","#80deea","#4dd0e1","#26c6da","#00bcd4","#00acc1","#0097a7","#00838f","#006064"],
        "Teal":        ["#e0f2f1","#b2dfdb","#80cbc4","#4db6ac","#26a69a","#009688","#00897b","#00796b","#00695c","#004d40"],
        "Green":       ["#e8f5e9","#c8e6c9","#a5d6a7","#81c784","#66bb6a","#4caf50","#43a047","#388e3c","#2e7d32","#1b5e20"],
        "Light Green": ["#f1f8e9","#dcedc8","#c5e1a5","#aed581","#9ccc65","#8bc34a","#7cb342","#689f38","#558b2f","#33691e"],
        "Lime":        ["#f9fbe7","#f0f4c3","#e6ee9c","#dce775","#d4e157","#cddc39","#c0ca33","#afb42b","#9e9d24","#827717"],
        "Yellow":      ["#fffde7","#fff9c4","#fff59d","#fff176","#ffee58","#ffeb3b","#fdd835","#fbc02d","#f9a825","#f57f17"],
        "Amber":       ["#fff8e1","#ffecb3","#ffe082","#ffd54f","#ffca28","#ffc107","#ffb300","#ffa000","#ff8f00","#ff6f00"],
        "Orange":      ["#fff3e0","#ffe0b2","#ffcc80","#ffb74d","#ffa726","#ff9800","#fb8c00","#f57c00","#ef6c00","#e65100"],
        "Deep Orange": ["#fbe9e7","#ffccbc","#ffab91","#ff8a65","#ff7043","#ff5722","#f4511e","#e64a19","#d84315","#bf360c"],
        "Brown":       ["#efebe9","#d7ccc8","#bcaaa4","#a1887f","#8d6e63","#795548","#6d4c41","#5d4037","#4e342e","#3e2723"],
        "Grey":        ["#fafafa","#f5f5f5","#eeeeee","#e0e0e0","#bdbdbd","#9e9e9e","#757575","#616161","#424242","#212121"],
        "Blue Grey":   ["#eceff1","#cfd8dc","#b0bec5","#90a4ae","#78909c","#607d8b","#546e7a","#455a64","#37474f","#263238"],
      };

      // ---- color math for the model rows ----
      function hexToRgb(hex) {
        const n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }
      function rgbToHslHsv([r, g, b]) {
        const r1 = r / 255, g1 = g / 255, b1 = b / 255;
        const max = Math.max(r1, g1, b1), min = Math.min(r1, g1, b1), d = max - min;
        let h = 0;
        if (d) {
          if (max === r1) h = ((g1 - b1) / d) % 6;
          else if (max === g1) h = (b1 - r1) / d + 2;
          else h = (r1 - g1) / d + 4;
          h = Math.round(h * 60);
          if (h < 0) h += 360;
        }
        const l = (max + min) / 2;
        const sl = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
        const sv = max === 0 ? 0 : d / max;
        const pc = (x) => `${Math.round(x * 100)}%`;
        return {
          hsl: `hsl(${h}, ${pc(sl)}, ${pc(l)})`,
          hsv: `hsv(${h}, ${pc(sv)}, ${pc(max)})`,
        };
      }

      const input = document.getElementById("color-input");
      const preview = document.getElementById("preview");
      const modelsEl = document.getElementById("models");

      function setColor(hex) {
        input.value = hex;
        preview.style.background = hex;
        const rgb = hexToRgb(hex);
        const { hsl, hsv } = rgbToHslHsv(rgb);
        const rows = { hex, rgb: `rgb(${rgb.join(", ")})`, hsl, hsv };
        modelsEl.innerHTML = Object.entries(rows)
          .map(([k, v]) => `<div class="model-row"><span class="key">${k}</span><span class="val">${v}</span></div>`)
          .join("");
      }

      // ---- history ----
      const historyEl = document.getElementById("history");
      const history = [];
      function renderHistory() {
        historyEl.style.display = history.length ? "flex" : "none";
        historyEl.innerHTML = '<span class="label">历史</span>' + history
          .map((hex) => `<button class="swatch" style="background:${hex}" title="${hex}" data-hex="${hex}"></button>`)
          .join("");
      }
      document.getElementById("save-btn").addEventListener("click", () => {
        const hex = input.value.trim();
        if (!/^#[0-9a-f]{6}$/i.test(hex)) return;
        const i = history.indexOf(hex.toLowerCase());
        if (i !== -1) history.splice(i, 1);
        history.unshift(hex.toLowerCase());
        if (history.length > 20) history.pop();
        renderHistory();
      });
      historyEl.addEventListener("click", (e) => {
        const hex = e.target.dataset?.hex;
        if (hex) setColor(hex);
      });

      // ---- palettes ----
      const bodyEl = document.getElementById("palettes-body");
      function renderPalette(which) {
        const data = which === "tailwind" ? tailwind : material;
        const shades = which === "tailwind" ? TW_SHADES : MAT_SHADES;
        const nameOf = which === "tailwind"
          ? (hue, i) => `${hue}-${shades[i]}`
          : (hue, i) => `${hue} ${shades[i]}`;
        bodyEl.innerHTML = Object.entries(data)
          .map(([hue, hexes]) => `
            <div class="hue-row">
              <span class="hue-name">${hue}</span>
              <div class="cells">${hexes
                .map((hex, i) => `<button class="cell" style="background:${hex}" title="${nameOf(hue, i)} ${hex}" data-hex="${hex}"></button>`)
                .join("")}</div>
            </div>`)
          .join("");
      }
      bodyEl.addEventListener("click", (e) => {
        const hex = e.target.dataset?.hex;
        if (hex) setColor(hex);
      });
      document.querySelectorAll(".ptab").forEach((tab) => {
        tab.addEventListener("click", (e) => {
          e.stopPropagation();
          document.querySelectorAll(".ptab").forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          renderPalette(tab.dataset.palette);
        });
      });
      document.getElementById("palettes-header").addEventListener("click", (e) => {
        if (e.target.closest(".ptab")) return;
        document.getElementById("palettes").classList.toggle("collapsed");
      });

      // ---- seed demo state ----
      setColor("#6e8bff");
      ["#6e8bff", "#ef4444", "#10b981", "#f59e0b", "#0d9488"].forEach((hex) => history.push(hex));
      renderHistory();
      renderPalette("tailwind");
    </script>
  </body>
</html>
